name: ColorizePhoto
options:
  bundleIdPrefix: kz.colorize
  deploymentTarget:
    iOS: '17.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    TARGETED_DEVICE_FAMILY: '1,2'
    CODE_SIGNING_ALLOWED: NO
    GENERATE_INFOPLIST_FILE: YES
    MARKETING_VERSION: '1.0.0'
    CURRENT_PROJECT_VERSION: '1'
targets:
  ColorizePhoto:
    type: application
    platform: iOS
    sources:
      - PhotoApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: kz.colorize.photo
        INFOPLIST_KEY_CFBundleDisplayName: Colorize Photo
        INFOPLIST_KEY_NSPhotoLibraryAddUsageDescription: Сохранение обработанной фотографии в вашу галерею.
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        COREML_CODEGEN_LANGUAGE: None
  PhotoTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests]
    dependencies:
      - target: ColorizePhoto
  PhotoUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: ColorizePhoto
schemes:
  ColorizePhoto:
    build:
      targets:
        ColorizePhoto: all
    test:
      targets: [PhotoTests, PhotoUITests]
